<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day! ❤️</title>
    <style>
        /* --- LUXURY SETUP --- */
        body {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; overflow: hidden;
            background: radial-gradient(circle at center, #2c0712 0%, #000000 100%);
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: white;
        }

        /* --- SPLASH SCREEN --- */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; align-items: center; justify-content: center;
            z-index: 100; transition: opacity 1.5s ease;
        }
        #splash button {
            background: none; border: 2px solid #ff4d6d; color: #ff4d6d;
            padding: 15px 30px; font-size: 1.2rem; cursor: pointer;
            border-radius: 50px; text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.4);
            transition: 0.3s;
        }
        #splash button:hover { background: #ff4d6d; color: white; box-shadow: 0 0 40px #ff4d6d; }

        /* --- MAIN CONTENT --- */
        #main-content { opacity: 0; display: none; text-align: center; width: 100%; }

        h1 { color: #ff4d6d; font-size: 1.8rem; margin-bottom: 5px; text-shadow: 0 0 15px rgba(255, 77, 109, 0.5); }
        p { color: #ccc; font-size: 0.9rem; margin-bottom: 20px; }

        /* --- BOUQUET & PHOTOS --- */
        .experience-area { position: relative; width: 100%; max-width: 600px; height: 500px; margin: 0 auto; }

        .bouquet-container {
            position: relative; width: 300px; height: 400px; margin: 0 auto;
            z-index: 5; animation: sway 5s ease-in-out infinite;
        }
        svg { width: 100%; height: 100%; filter: drop-shadow(0 0 20px rgba(255, 0, 70, 0.2)); }

        /* --- PHOTO FRAMES (POLAROID) --- */
        .photo {
            position: absolute; width: 100px; background: white; padding: 8px 8px 25px 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); transform: scale(0);
            transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 2;
        }
        .photo img { width: 100%; height: 100px; object-fit: cover; background: #eee; }
        
        /* Posisi Foto di Sekitar Bunga */
        .p-1 { top: 20px; left: 10%; transform: rotate(-15deg); }
        .p-2 { top: 50px; right: 10%; transform: rotate(15deg); }
        .p-3 { bottom: 100px; left: 5%; transform: rotate(-10deg); }
        .p-4 { bottom: 80px; right: 5%; transform: rotate(10deg); }

        .show-photo { transform: scale(1) !important; }

        /* --- ANIMATIONS --- */
        @keyframes sway { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
        
        .final-message {
            margin-top: 20px; font-style: italic; color: #ff8fab; max-width: 320px; 
            margin-left: auto; margin-right: auto; line-height: 1.6;
        }

        .sparkle { position: absolute; background: white; border-radius: 50%; opacity: 0; animation: twinkle var(--d) infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(0); } 50% { opacity: 0.7; transform: scale(1); } }
    </style>
</head>
<body>

    <div id="splash">
        <button onclick="startExperience()">tap for the rose</button>
    </div>

    <div id="main-content">
        <h1>For You, Dear🌹</h1>
        <p>A digital bloom, sent all the way to Austria.</p>

        <div class="experience-area">
            <div class="photo p-1" id="img1">
                <img src="foto1.jpeg" alt="Memory 1">
            </div>
            <div class="photo p-2" id="img2">
                <img src="foto2.jpeg" alt="Memory 2">
            </div>

            <div class="bouquet-container">
                <svg viewBox="0 0 400 500">
                    <defs>
                        <filter id="shadow"><feGaussianBlur in="SourceAlpha" stdDeviation="3" /><feOffset dx="2" dy="4" /><feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge></filter>
                        <radialGradient id="roseG" cx="50%" cy="40%" r="50%"><stop offset="0%" stop-color="#ff1a75" /><stop offset="60%" stop-color="#b3003b" /><stop offset="100%" stop-color="#4d0019" /></radialGradient>
                        <symbol id="detailedRose" viewBox="0 0 100 100">
                            <g filter="url(#shadow)">
                                <path d="M50,90 Q80,90 90,60 Q90,30 50,40 Q10,30 10,60 Q20,90 50,90" fill="url(#roseG)" />
                                <circle cx="50" cy="50" r="20" fill="#cc0044" /><circle cx="50" cy="45" r="12" fill="#990033" />
                            </g>
                        </symbol>
                    </defs>
                    <path d="M200,500 L100,250 C80,200 320,200 300,250 L200,500" fill="#1a1a1a" />
                    <g fill="#2d4d2d">
                        <ellipse cx="150" cy="200" rx="30" ry="15" transform="rotate(-40 150 200)" />
                        <ellipse cx="250" cy="200" rx="30" ry="15" transform="rotate(40 250 200)" />
                    </g>
                    <use href="#detailedRose" x="150" y="150" width="100" height="100" />
                    <use href="#detailedRose" x="100" y="180" width="90" height="90" />
                    <use href="#detailedRose" x="210" y="180" width="90" height="90" />
                    <use href="#detailedRose" x="155" y="210" width="95" height="95" />
                </svg>
            </div>

            <div class="photo p-3" id="img3">
                <img src="foto3.jpeg" alt="Memory 3">
            </div>
            <div class="photo p-4" id="img4">
                <img src="foto4.jpeg" alt="Memory 4">
            </div>
        </div>

        <div class="final-message">
            "Because there is no space, I coded this permanent rose just for you. It blooms every time you open this link. Hope u like it dear."
        </div>
    </div>

    <script>
        // Sparkles
        for (let i = 0; i < 20; i++) {
            let s = document.createElement('div');
            s.className = 'sparkle';
            s.style.width = s.style.height = Math.random() * 3 + 'px';
            s.style.left = Math.random() * 100 + 'vw';
            s.style.top = Math.random() * 100 + 'vh';
            s.style.setProperty('--d', Math.random() * 3 + 2 + 's');
            document.body.appendChild(s);
        }

        function startExperience() {
            // Sembunyikan Splash
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                // Tampilkan Konten Utama
                const main = document.getElementById('main-content');
                main.style.display = 'block';
                setTimeout(() => { main.style.opacity = '1'; }, 50);
                
                // Munculkan Foto Satu per Satu
                setTimeout(() => { document.getElementById('img1').classList.add('show-photo'); }, 1000);
                setTimeout(() => { document.getElementById('img2').classList.add('show-photo'); }, 1500);
                setTimeout(() => { document.getElementById('img3').classList.add('show-photo'); }, 2000);
                setTimeout(() => { document.getElementById('img4').classList.add('show-photo'); }, 2500);
            }, 1500);
        }
    </script>
</body>
</html>
