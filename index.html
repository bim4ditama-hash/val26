<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day! ❤️</title>
    <style>
        /* --- SETUP DASAR --- */
        body {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; background: radial-gradient(circle at center, #fff5f7, #ffe0e9);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0; overflow: hidden; padding: 20px;
        }

        .container { text-align: center; z-index: 10; max-width: 600px; }

        /* TULISAN (TIDAK DIUBAH) */
        h1 { color: #c70039; font-size: 1.8rem; margin-bottom: 5px; opacity: 0; animation: fadeIn 2s forwards; }
        p { color: #999; font-size: 1rem; margin-bottom: 30px; opacity: 0; animation: fadeIn 2s 1s forwards; }

        /* --- SVG BOUQUET CONTAINER --- */
        .bouquet-wrapper {
            position: relative; width: 320px; height: 380px;
            margin: 0 auto;
            /* Efek bayangan agar buket terlihat melayang */
            filter: drop-shadow(0 15px 25px rgba(199, 0, 57, 0.2));
            /* Animasi muncul membesar dan bergoyang */
            animation: bloomUp 3s cubic-bezier(0.25, 1, 0.5, 1) forwards, sway 6s ease-in-out infinite 3s;
            opacity: 0; /* Mulai dari invisible */
        }

        svg { width: 100%; height: 100%; overflow: visible; }

        /* --- ANIMASI --- */
        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes bloomUp { 
            from { transform: scale(0.5) translateY(100px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }
        @keyframes sway {
            0%, 100% { transform: rotate(-1deg) translateY(0); }
            50% { transform: rotate(1deg) translateY(-8px); }
        }

        .final-message {
            margin-top: 40px; font-style: italic; color: #c70039;
            opacity: 0; animation: fadeIn 2s 3.5s forwards;
            max-width: 350px; line-height: 1.5; margin-left: auto; margin-right: auto;
            background: rgba(255,255,255,0.5); padding: 15px; border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>For You, Dear🌹</h1>
        <p>A digital bloom, sent all the way to Austria.</p>

        <div class="bouquet-wrapper">
            <svg viewBox="0 0 400 500">
                <defs>
                    <radialGradient id="roseGrad" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
                        <stop offset="0%" style="stop-color:#ff8fab" />
                        <stop offset="40%" style="stop-color:#ff4d6d" />
                        <stop offset="100%" style="stop-color:#c70039" />
                    </radialGradient>
                    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#1a472a" />
                        <stop offset="100%" style="stop-color:#4a9c42" />
                    </linearGradient>
                     <linearGradient id="wrapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#f3e5d8" />
                        <stop offset="50%" style="stop-color:#fffcf8" />
                        <stop offset="100%" style="stop-color:#e6d2c0" />
                    </linearGradient>

                    <g id="singleRose">
                        <ellipse cx="0" cy="0" rx="35" ry="30" fill="url(#roseGrad)" transform="rotate(20)"/>
                        <ellipse cx="5" cy="-5" rx="30" ry="28" fill="url(#roseGrad)" transform="rotate(60)"/>
                        <ellipse cx="-5" cy="5" rx="32" ry="28" fill="url(#roseGrad)" transform="rotate(-30)"/>
                        <ellipse cx="0" cy="-10" rx="25" ry="25" fill="url(#roseGrad)" opacity="0.9"/>
                        <circle cx="0" cy="-10" r="15" fill="#96002b"/>
                        <circle cx="2" cy="-12" r="8" fill="#ff8fab" opacity="0.5"/>
                    </g>
                </defs>

                <path d="M100,480 L50,250 C50,250 150,180 350,250 L300,480 Z" fill="url(#wrapGrad)" stroke="#dcc0a8" stroke-width="2"/>
                <g fill="url(#leafGrad)">
                    <path d="M200,250 Q150,150 100,250 Q150,350 200,250" transform="translate(-80, -50) rotate(-30) scale(1.5)"/>
                    <path d="M200,250 Q250,150 300,250 Q250,350 200,250" transform="translate(80, -60) rotate(30) scale(1.5)"/>
                    <path d="M200,250 Q200,100 250,250" transform="translate(0, -100) scale(1.2)"/>
                </g>
                
                <g fill="#ffffff" opacity="0.8">
                    <circle cx="150" cy="180" r="5"/><circle cx="160" cy="170" r="4"/>
                    <circle cx="250" cy="190" r="5"/><circle cx="265" cy="200" r="3"/>
                    <circle cx="200" cy="150" r="4"/><circle cx="210" cy="140" r="5"/>
                     <circle cx="100" cy="220" r="4"/><circle cx="300" cy="210" r="5"/>
                </g>

                <use href="#singleRose" transform="translate(200, 180) scale(1.4)"/> <use href="#singleRose" transform="translate(130, 220) scale(1.1) rotate(-20)"/>
                <use href="#singleRose" transform="translate(270, 210) scale(1.1) rotate(20)"/>
                <use href="#singleRose" transform="translate(150, 130) scale(0.9) rotate(-10)"/>
                <use href="#singleRose" transform="translate(250, 140) scale(0.9) rotate(15)"/>
                <use href="#singleRose" transform="translate(200, 100) scale(0.8)"/> <path d="M100,480 Q200,520 300,480" stroke="#c70039" stroke-width="8" fill="none"/> <path d="M160,350 Q200,400 240,350 L200,480 Z" fill="url(#wrapGrad)" opacity="0.6"/> <path d="M180,360 C150,340 150,380 180,400 C210,420 180,440 200,450 C220,440 190,420 220,400 C250,380 250,340 220,360 Q200,380 180,360" fill="#c70039"/> </svg>
        </div>

        <div class="final-message">
            "Because there is no space, I coded this permanent rose just for you. It blooms every time you open this link. Hope u like it dear."
        </div>
    </div>

</body>
</html>
