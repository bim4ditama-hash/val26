<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day! ❤️</title>
    <style>
        body {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; overflow: hidden;
            background: radial-gradient(circle at center, #2c0712 0%, #000000 100%);
            font-family: 'Segoe UI', Roboto, sans-serif; color: white;
        }

        /* --- SPLASH SCREEN --- */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; align-items: center; justify-content: center;
            z-index: 100; transition: opacity 1.5s ease;
        }
        #splash button {
            background: none; border: 2px solid #ff4d6d; color: #ff4d6d;
            padding: 15px 40px; font-size: 1.2rem; cursor: pointer;
            border-radius: 50px; text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.4); transition: 0.3s;
        }
        #splash button:hover { background: #ff4d6d; color: white; box-shadow: 0 0 40px #ff4d6d; }

        /* --- FLOWER PAGE --- */
        #flower-page { display: none; opacity: 0; transition: opacity 1s; text-align: center; }
        .guide-text { color: #ff8fab; font-style: italic; margin-top: 10px; animation: pulse 2s infinite; }
        
        .rose-clickable { cursor: pointer; transition: opacity 0.5s, transform 0.5s; }
        .rose-clickable:hover { transform: scale(1.1); filter: brightness(1.2); }
        .rose-hidden { opacity: 0 !important; pointer-events: none; transform: translateY(-20px) scale(0); }

        /* --- PHOTO & COUNTER PAGE --- */
        #photo-page { display: none; opacity: 0; transition: opacity 1.5s; text-align: center; width: 100%; }
        .counter-box { font-size: 1.5rem; color: #ff4d6d; margin: 20px 0; text-shadow: 0 0 10px rgba(255, 77, 109, 0.5); }
        
        .experience-area { position: relative; width: 100%; max-width: 600px; height: 400px; margin: 0 auto; }
        .photo {
            position: absolute; width: 120px; background: white; padding: 10px 10px 30px 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); transform: rotate(var(--r)) scale(0);
            transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .photo img { width: 100%; height: 120px; object-fit: cover; }
        .show-photo { transform: rotate(var(--r)) scale(1) !important; }

        /* --- ANIMATIONS --- */
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes sway { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }

        .final-message { margin-top: 30px; font-style: italic; color: #ff8fab; opacity: 0; animation: fadeIn 2s 3s forwards; }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="valentine.mp3" type="audio/mpeg">
    </audio>

    <div id="splash">
        <button onclick="startExperience()">click here</button>
    </div>

    <div id="flower-page">
        <h1>For You, Dear🌹</h1>
        <p>A digital bloom, sent all the way to Austria.</p>
        <p class="guide-text">tap all the flowers</p>

        <div style="width: 350px; height: 400px; margin: 0 auto;">
            <svg viewBox="0 0 400 500">
                <defs>
                    <radialGradient id="roseG" cx="50%" cy="40%" r="50%"><stop offset="0%" stop-color="#ff1a75" /><stop offset="60%" stop-color="#b3003b" /><stop offset="100%" stop-color="#4d0019" /></radialGradient>
                    <symbol id="detailedRose" viewBox="0 0 100 100">
                        <path d="M50,90 Q80,90 90,60 Q90,30 50,40 Q10,30 10,60 Q20,90 50,90" fill="url(#roseG)" />
                        <circle cx="50" cy="50" r="20" fill="#cc0044" /><circle cx="50" cy="45" r="12" fill="#990033" />
                    </symbol>
                </defs>
                <path d="M200,500 L100,250 C80,200 320,200 300,250 L200,500" fill="#1a1a1a" />
                
                <g class="rose-clickable" onclick="removeRose(this)"><use href="#detailedRose" x="150" y="150" width="100" height="100" /></g>
                <g class="rose-clickable" onclick="removeRose(this)"><use href="#detailedRose" x="100" y="180" width="90" height="90" /></g>
                <g class="rose-clickable" onclick="removeRose(this)"><use href="#detailedRose" x="210" y="180" width="90" height="90" /></g>
                <g class="rose-clickable" onclick="removeRose(this)"><use href="#detailedRose" x="155" y="210" width="95" height="95" /></g>
                <g class="rose-clickable" onclick="removeRose(this)"><use href="#detailedRose" x="120" y="110" width="80" height="80" /></g>
                <g class="rose-clickable" onclick="removeRose(this)"><use href="#detailedRose" x="200" y="110" width="80" height="80" /></g>
            </svg>
        </div>
    </div>

    <div id="photo-page">
        <h1>Together Forever ❤️</h1>
        
        <div class="counter-box" id="dayCounter">
            how many days we've been together: <br>
            <strong>0 days</strong>
        </div>

        <div class="experience-area">
            <div class="photo" style="--r:-15deg; top:0; left:10%"><img src="foto1.jpg"></div>
            <div class="photo" style="--r:10deg; top:20px; right:10%"><img src="foto2.jpg"></div>
            <div class="photo" style="--r:-5deg; bottom:50px; left:5%"><img src="foto3.jpg"></div>
            <div class="photo" style="--r:15deg; bottom:30px; right:5%"><img src="foto4.jpg"></div>
        </div>

        <div class="final-message">
            "Because there is no space, I coded this permanent rose just for you. It blooms every time you open this link. Hope u like it dear."
        </div>
    </div>

    <script>
        let rosesLeft = 6;
        const startDate = new Date("2025-07-31");

        function startExperience() {
            // Putar Musik
            document.getElementById('bgMusic').play();
            
            // Transisi ke Halaman Bunga
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                const flowerPage = document.getElementById('flower-page');
                flowerPage.style.display = 'block';
                setTimeout(() => { flowerPage.style.opacity = '1'; }, 50);
            }, 1500);
        }

        function removeRose(el) {
            el.classList.add('rose-hidden');
            rosesLeft--;
            
            if (rosesLeft === 0) {
                setTimeout(showPhotoPage, 1000);
            }
        }

        function showPhotoPage() {
            // Update Counter Hari
            const now = new Date();
            const diffTime = Math.abs(now - startDate);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            document.getElementById('dayCounter').innerHTML = `how many days we've been together: <br><strong>${diffDays} days</strong>`;

            // Transisi Halaman
            document.getElementById('flower-page').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('flower-page').style.display = 'none';
                const photoPage = document.getElementById('photo-page');
                photoPage.style.display = 'block';
                setTimeout(() => { 
                    photoPage.style.opacity = '1'; 
                    // Munculkan foto satu per satu
                    const photos = document.querySelectorAll('.photo');
                    photos.forEach((p, i) => {
                        setTimeout(() => p.classList.add('show-photo'), i * 500);
                    });
                }, 50);
            }, 1000);
        }
    </script>
</body>
</html>
