<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day! ❤️</title>
    <style>
        /* --- SETUP DASAR --- */
        body {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; background: #fff5f7;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0; overflow: hidden;
        }

        .container { text-align: center; z-index: 10; }

        h1 { color: #d63384; font-size: 1.8rem; margin-bottom: 5px; opacity: 0; animation: fadeIn 2s forwards; }
        p { color: #999; font-size: 1rem; margin-bottom: 30px; opacity: 0; animation: fadeIn 2s 1s forwards; }

        /* --- THE ULTIMATE ROSE (SVG) --- */
        .rose-wrapper {
            position: relative; width: 250px; height: 300px;
            margin: 0 auto;
            filter: drop-shadow(0 0 20px rgba(214, 51, 132, 0.2));
            animation: sway 4s ease-in-out infinite;
        }

        svg { width: 100%; height: 100%; }

        /* Animasi Mekar */
        .rose-head {
            transform-origin: center;
            animation: bloom 3s ease-out forwards;
        }

        /* --- PARTIKEL KELOPAK JATUH --- */
        .petal-particle {
            position: absolute; background: #ff4d6d;
            border-radius: 150% 0 150% 0;
            opacity: 0.3; pointer-events: none;
            animation: fall linear infinite;
        }

        /* --- ANIMASI --- */
        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes sway {
            0%, 100% { transform: rotate(-2deg) translateY(0); }
            50% { transform: rotate(2deg) translateY(-5px); }
        }
        @keyframes bloom {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.3; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        .final-message {
            margin-top: 30px; font-style: italic; color: #d63384;
            opacity: 0; animation: fadeIn 2s 4s forwards;
            max-width: 300px; line-height: 1.5;
        }
    </style>
</head>
<body>

    <div id="particles"></div>

    <div class="container">
        <h1>For You, Dear 🌹</h1>
        <p>A little bloom from Indonesia to Austria.</p>

        <div class="rose-wrapper">
            <svg viewBox="0 0 200 250">
                <path d="M100,250 C100,200 90,150 100,100" stroke="#2d5a27" stroke-width="4" fill="none" stroke-linecap="round" />
                
                <path d="M100,180 C70,180 60,150 100,160" fill="#4a9c42" opacity="0">
                    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="2s" fill="freeze" />
                </path>
                
                <path d="M100,210 C130,210 140,180 100,190" fill="#2d5a27" opacity="0">
                    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="2.2s" fill="freeze" />
                </path>

                <g class="rose-head">
                    <ellipse cx="100" cy="80" rx="45" ry="55" fill="url(#grad1)" />
                    <ellipse cx="100" cy="80" rx="45" ry="55" fill="url(#grad1)" transform="rotate(60 100 80)" />
                    <ellipse cx="100" cy="80" rx="45" ry="55" fill="url(#grad1)" transform="rotate(-60 100 80)" />
                    
                    <ellipse cx="100" cy="80" rx="30" ry="40" fill="#e63946" />
                    <ellipse cx="100" cy="80" rx="30" ry="40" fill="#e63946" transform="rotate(45 100 80)" />
                    <ellipse cx="100" cy="80" rx="30" ry="40" fill="#e63946" transform="rotate(-45 100 80)" />
                    
                    <circle cx="100" cy="75" r="15" fill="#c70039" />
                </g>

                <defs>
                    <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#ff4d6d;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#c70039;stop-opacity:1" />
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <div class="final-message">
            "Because there is no space, I coded this permanent rose just for you. It blooms every time you open this link. Hope u like it dear."
        </div>
    </div>

    <script>
        // Script untuk membuat kelopak berjatuhan secara acak
        const particleContainer = document.getElementById('particles');
        const particleCount = 15;

        for (let i = 0; i < particleCount; i++) {
            const petal = document.createElement('div');
            petal.className = 'petal-particle';
            
            // Random size, position, and timing
            const size = Math.random() * 10 + 5 + 'px';
            petal.style.width = size;
            petal.style.height = size;
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.animationDuration = Math.random() * 5 + 5 + 's';
            petal.style.animationDelay = Math.random() * 5 + 's';
            
            particleContainer.appendChild(petal);
        }
    </script>
</body>
</html>
