<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day! ❤️</title>
    <style>
        /* --- LUXURY SETUP --- */
        body {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; overflow: hidden;
            background: radial-gradient(circle at center, #2c0712 0%, #000000 100%);
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: white;
        }

        .container { text-align: center; z-index: 10; position: relative; }

        /* TULISAN (IDENTIK) */
        h1 { color: #ff4d6d; font-size: 2rem; margin-bottom: 5px; opacity: 0; animation: fadeIn 2s forwards; text-shadow: 0 0 15px rgba(255, 77, 109, 0.5); }
        p { color: #ccc; font-size: 1rem; margin-bottom: 20px; opacity: 0; animation: fadeIn 2s 1s forwards; }

        /* --- THE MASTERPIECE BOUQUET --- */
        .bouquet-container {
            position: relative; width: 350px; height: 450px;
            margin: 0 auto;
            transform-origin: bottom center;
            animation: emerge 2.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, sway 5s ease-in-out infinite 2.5s;
        }

        svg { width: 100%; height: 100%; filter: drop-shadow(0 0 20px rgba(255, 0, 70, 0.2)); }

        /* --- ANIMATIONS --- */
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
        @keyframes emerge {
            from { opacity: 0; transform: scale(0.5) translateY(200px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes sway {
            0%, 100% { transform: rotate(-1.5deg); }
            50% { transform: rotate(1.5deg); }
        }

        .final-message {
            margin-top: 30px; font-style: italic; color: #ff8fab;
            opacity: 0; animation: fadeIn 2s 4s forwards;
            max-width: 320px; line-height: 1.6; margin-left: auto; margin-right: auto;
        }

        /* Particles */
        .sparkle {
            position: absolute; background: white; border-radius: 50%;
            opacity: 0; animation: twinkle var(--d) infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 0.7; transform: scale(1); }
        }
    </style>
</head>
<body>

    <script>
        for (let i = 0; i < 30; i++) {
            let s = document.createElement('div');
            s.className = 'sparkle';
            s.style.width = s.style.height = Math.random() * 3 + 'px';
            s.style.left = Math.random() * 100 + 'vw';
            s.style.top = Math.random() * 100 + 'vh';
            s.style.setProperty('--d', Math.random() * 3 + 2 + 's');
            s.style.animationDelay = Math.random() * 5 + 's';
            document.body.appendChild(s);
        }
    </script>

    <div class="container">
        <h1>For You, Dear🌹</h1>
        <p>A digital bloom, sent all the way to Austria.</p>

        <div class="bouquet-container">
            <svg viewBox="0 0 400 500">
                <defs>
                    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
                        <feOffset dx="2" dy="4" result="offsetblur" />
                        <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
                        <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
                    </filter>
                    
                    <radialGradient id="roseG" cx="50%" cy="40%" r="50%">
                        <stop offset="0%" stop-color="#ff1a75" />
                        <stop offset="60%" stop-color="#b3003b" />
                        <stop offset="100%" stop-color="#4d0019" />
                    </radialGradient>

                    <symbol id="detailedRose" viewBox="0 0 100 100">
                        <g filter="url(#shadow)">
                            <path d="M50,90 Q80,90 90,60 Q90,30 50,40 Q10,30 10,60 Q20,90 50,90" fill="url(#roseG)" />
                            <path d="M50,85 Q75,85 85,55 Q85,25 50,35 Q15,25 15,55 Q25,85 50,85" fill="#e6005c" opacity="0.8" />
                            <circle cx="50" cy="50" r="25" fill="#cc0044" />
                            <circle cx="50" cy="45" r="18" fill="#990033" />
                            <path d="M40,40 Q50,20 60,40 Q50,50 40,40" fill="#ff4d88" opacity="0.6" />
                        </g>
                    </symbol>
                </defs>

                <path d="M200,500 L100,250 C80,200 320,200 300,250 L200,500" fill="#1a1a1a" />
                <path d="M200,500 L120,250 Q200,220 280,250 L200,500" fill="#333" opacity="0.5" />

                <g fill="#2d4d2d">
                    <ellipse cx="150" cy="200" rx="40" ry="20" transform="rotate(-40 150 200)" />
                    <ellipse cx="250" cy="200" rx="40" ry="20" transform="rotate(40 250 200)" />
                    <ellipse cx="200" cy="150" rx="30" ry="50" />
                </g>

                <g fill="white">
                    <circle cx="130" cy="180" r="3" /><circle cx="140" cy="160" r="2" />
                    <circle cx="260" cy="170" r="3" /><circle cx="270" cy="190" r="2" />
                    <circle cx="200" cy="130" r="3" /><circle cx="180" cy="150" r="2" />
                </g>

                <use href="#detailedRose" x="150" y="150" width="100" height="100" />
                <use href="#detailedRose" x="100" y="180" width="90" height="90" />
                <use href="#detailedRose" x="210" y="180" width="90" height="90" />
                <use href="#detailedRose" x="155" y="210" width="95" height="95" />
                <use href="#detailedRose" x="120" y="110" width="80" height="80" />
                <use href="#detailedRose" x="200" y="110" width="80" height="80" />
                
                <path d="M170,400 Q200,420 230,400 L210,480 L190,480 Z" fill="#ff0040" />
                <circle cx="200" cy="405" r="10" fill="#b3002d" />
            </svg>
        </div>

        <div class="final-message">
            "Because there is no space, I coded this permanent rose just for you. It blooms every time you open this link. Hope u like it dear."
        </div>
    </div>

</body>
</html>
